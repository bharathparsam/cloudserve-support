name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
      - run: pip install -r requirements-linux-amd64.txt
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser -- tests/console.spec.ts tests/operator-settings.spec.ts
        working-directory: frontend
