services:
  app:
    build: .
    env_file: .env
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      DATABASE_URL: sqlite:////app/storage/decisions.db
      CHROMA_PATH: /app/storage/chroma
      HF_HOME: /app/storage/cache/huggingface
      CORPUS_PATH: /app/assets/corpus/documentation.json
      CLASSIFIER_DIR: /app/assets/models
      POLICY_PATH: /app/policies/routing.json
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./storage:/app/storage
      - ./data/input:/data/input:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
  grafana:
    image: grafana/grafana:12.2.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set local Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on: [prometheus]
volumes:
  prometheus_data:
  grafana_data:
